<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#04060c" />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="ZEUS — a three-ring anti-cheat architecture: user-mode sentinel, kernel driver, and external arbiter. Conviction-grade detection without the false positives."
    />
    <!--
      The title and description describe the landing page, because that is what `/` serves
      and what a crawler or a link preview will read. Once the bundle boots, `src/main.tsx`
      sets the title per surface, so the console's own pages name themselves.
    -->
    <title>ZEUS — Multi-Layer Anti-Cheat Architecture</title>
    <!--
      Space Grotesk and JetBrains Mono are SERVED FROM THIS ORIGIN, not fetched from a
      font host: `/privacy` states that these pages load exactly one origin, and a
      Google Fonts link here would have quietly made that claim false. They are declared
      in `src/fonts.css` with the .woff2 files in `public/fonts/`. The console's own
      monospace stack is local-first and unchanged.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M17 2 6 18h7l-2 12L26 12h-8l4-10z' fill='%2357e0ff'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
